services:
  - type: web
    name: vfr-decision-engine
    env: python
    pythonVersion: "3.12"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Credencial del copiloto (Google AI Studio). `sync: false` hace que
      # Render la pida por panel y NO la guarde en el repositorio.
      # Sin ella la app arranca igual y el asistente queda no disponible.
      - key: GEMINI_API_KEY
        sync: false
